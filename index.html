<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="description" content="Control de kilómetros realizados y perdidos por vuelta, para las líneas 188 y 20.">
    <title>Calculadora de Recorridos</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/favicon.png">
    <script>
        // Aplica el tema guardado antes de dibujar la página (evita el parpadeo)
        try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar__inner">
            <div class="topbar__logo"><img src="img/logo-dota.png" alt="DOTA"></div>
            <div class="topbar__texto">
                <h1>Calculadora de Recorridos</h1>
                <p>Control de kilómetros por vuelta</p>
            </div>
            <button type="button" id="btn-tema" class="btn-tema" aria-label="Cambiar a tema oscuro" title="Cambiar tema">🌙</button>
        </div>
    </header>

    <main class="app">

        <div class="layout">
        <aside class="panel">
        <section class="card config">
            <!-- 1. Línea -->
            <div class="step">
                <div class="step__title"><span class="step__num">1</span> Línea</div>
                <div class="segmented" id="selector-linea" role="radiogroup" aria-label="Línea"></div>
            </div>

            <!-- 2. Traslados -->
            <div class="step">
                <div class="step__title"><span class="step__num">2</span> Traslados de la planilla</div>
                <div class="traslados">
                    <div class="traslados__grupo">
                        <span class="traslados__label">Ida</span>
                        <label class="chip"><input type="checkbox" data-traslado="ida-noria" data-grupo="ida"><span>La Noria <b>+11,50</b></span></label>
                        <label class="chip"><input type="checkbox" data-traslado="ida-117" data-grupo="ida"><span>117 <b>+3,50</b></span></label>
                    </div>
                    <div class="traslados__grupo">
                        <span class="traslados__label">Vuelta</span>
                        <label class="chip"><input type="checkbox" data-traslado="vuelta-noria" data-grupo="vuelta"><span>La Noria <b>+11,50</b></span></label>
                        <label class="chip"><input type="checkbox" data-traslado="vuelta-117" data-grupo="vuelta"><span>117 <b>+3,50</b></span></label>
                    </div>
                </div>
            </div>

            <!-- 3. Nueva vuelta -->
            <div class="step">
                <div class="step__title"><span class="step__num">3</span> Nueva vuelta</div>
                <label class="field">
                    <span>Ramal de ida</span>
                    <select id="select-ida"></select>
                </label>
                <label class="field">
                    <span>Ramal de vuelta</span>
                    <select id="select-vuelta"></select>
                </label>
                <div id="error-msg" class="alert" role="alert" hidden>Elegí al menos un ramal (ida o vuelta).</div>
                <button id="btn-agregar" class="btn btn--primary">＋ Agregar vuelta</button>
            </div>
        </section>

        <button id="btn-limpiar" class="btn btn--ghost btn--reset">Reiniciar planilla completa</button>

        <footer class="totales" aria-label="Totales">
            <div class="totales__fila">
                <div class="totales__item">
                    <span>Programado</span>
                    <strong id="res-total">0,00</strong>
                </div>
                <div class="totales__item totales__item--ok">
                    <span>Realizado</span>
                    <strong id="res-realizados">0,00</strong>
                </div>
                <div class="totales__item totales__item--bad">
                    <span>Perdido</span>
                    <strong id="res-perdidos">0,00</strong>
                </div>
            </div>
            <div class="totales__pie"><span id="count-vueltas">0</span> vueltas + traslados · km</div>
        </footer>
        </aside>

        <section id="vueltas-container" class="vueltas" aria-live="polite"></section>
        </div>
    </main>

    <script src="js/datos.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
